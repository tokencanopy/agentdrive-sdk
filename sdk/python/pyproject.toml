[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentdrive-sdk"
version = "0.1.0"
description = "Official Python SDK for the AgentDrive API"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Token Canopy" },
]
keywords = ["agentdrive", "agents", "artifacts", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28.1,<1",
  "pydantic>=2.11,<3",
  "python-dateutil>=2.8.2,<3",
  "typing-extensions>=4.7.1",
  "urllib3>=2.6.3,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.4,<9",
]

[project.urls]
Homepage = "https://agentdrive.run"
Documentation = "https://github.com/tokencanopy/agentdrive-sdk/blob/main/docs/python-sdk-api-reference.md"
Repository = "https://github.com/tokencanopy/agentdrive-sdk"
Issues = "https://github.com/tokencanopy/agentdrive-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentdrive_sdk"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/agentdrive_sdk",
]
