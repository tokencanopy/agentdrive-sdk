          description: The resource was not found or is not visible to the caller.
          headers:
            X-Request-Id:
              description: Request correlation identifier.
              explode: false
              schema:
                type: string
              style: simple
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
          description: Request validation failed.
          headers:
            X-Request-Id:
              description: Request correlation identifier.
              explode: false
              schema:
                type: string
              style: simple
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V0ErrorEnvelope"
          description: Rate limited.
          headers:
            Retry-After:
              description: Seconds until the caller should retry.
              explode: false
              schema:
                minimum: 0
                type: integer
              style: simple
            X-Request-Id:
              description: Request correlation identifier.
              explode: false
              schema:
                type: string
              style: simple
        "503":
