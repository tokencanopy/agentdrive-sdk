  /v0/search:
    get:
      description: |-
        Lexical (not semantic) full-text search powered by Postgres `websearch_to_tsquery`. Results are ranked by `ts_rank` over a weighted tsvector (path > content > metadata > labels).

        **Supported query syntax:**
        - Words: `kangaroo` (English stemming)
        - Phrases: `"exact phrase"`
        - Negation: `kangaroo -secret`
        - AND (implicit): `kangaroo secret`
        - OR: `kangaroo OR koala`
        - Paths & filenames: `reports/q3-summary.md` or `q3-summary.md` match by their path words (`/ . _ -` are word boundaries)

        **Not supported (v0):**
        - Semantic / embedding similarity
        - PDF and image content (only the path + metadata are searchable)
        - Non-English stemming
        - Fuzzy matching, regex
        - Boolean operator parentheses

        **Filters:** `label` (repeatable, AND), `file_type` (enum), `prefix` (path prefix), `updated_after` / `updated_before` (RFC 3339 timestamps, inclusive bounds on `updated_at`).
      operationId: search_v0_search_get
      parameters:
      - explode: true
        in: query
        name: q
        required: true
        schema:
          maxLength: 200
          minLength: 1
          title: Q
          type: string
        style: form
      - explode: true
        in: query
        name: label
        required: false
        schema:
          items:
            type: string
          title: Label
          type: array
          default: null
        style: form
      - explode: true
        in: query
        name: file_type
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: prefix
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: updated_after
        required: false
        schema:
          format: date-time
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: updated_before
        required: false
        schema:
          format: date-time
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchPage"
          description: Successful Response
