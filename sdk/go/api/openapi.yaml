        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveListOut"
          description: Successful Response
          headers:
            X-Request-Id:
              description: Request correlation identifier.
              explode: false
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V0ErrorEnvelope"
          description: "Malformed request (invalid query parameter, cursor, or argument)."
          headers:
            X-Request-Id:
              description: Request correlation identifier.
              explode: false
              schema:
                type: string
              style: simple
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V0ErrorEnvelope"
          description: Missing or invalid bearer token.
          headers:
            WWW-Authenticate:
              description: RFC 6750 bearer authentication challenge.
              explode: false
              schema:
                type: string
              style: simple
            X-Request-Id:
              description: Request correlation identifier.
              explode: false
              schema:
                type: string
              style: simple
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V0ErrorEnvelope"
          description: Token lacks a required scope.
          headers:
            X-Request-Id:
              description: Request correlation identifier.
              explode: false
