              schema:
                minimum: 0
                type: integer
              style: simple
            X-Request-Id:
              description: Request correlation identifier.
              explode: false
              schema:
                type: string
              style: simple
      security:
      - bearerAuth: []
      summary: List Drives
      tags:
      - drives
