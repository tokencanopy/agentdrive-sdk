      title: UploadBeginOut
    UploadStatusOut:
      description: |-
        Response of `GET /v0/uploads/{upload_id}` — the live state of a
        direct-to-GCS upload session (large-upload-design.md §5).

        `state` is derived, not a stored column:
          * `initiated` — session open; PUT the bytes to the `upload_url`, then
                          `POST /v0/uploads/{upload_id}/commit`.
          * `committed` — the bytes landed and the artifact was created
                          (`committed_at` is set).
          * `aborted`   — released via `DELETE /v0/uploads/{upload_id}`.
          * `expired`   — past `expires_at` without a commit; the reservation is
                          reclaimed by the GC sweep.
      example:
        committed_at: 2000-01-23T04:56:07.000+00:00
        content_type: content_type
        created_at: 2000-01-23T04:56:07.000+00:00
        expires_at: 2000-01-23T04:56:07.000+00:00
        max_bytes: 0
        path: path
        size_bytes: 6
        state: initiated
        upload_id: upload_id
      properties:
        committed_at:
          format: date-time
          nullable: true
          type: string
        content_type:
          title: Content Type
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        expires_at:
          format: date-time
          title: Expires At
          type: string
        max_bytes:
          title: Max Bytes
          type: integer
        path:
          title: Path
          type: string
        size_bytes:
          title: Size Bytes
          type: integer
        state:
          enum:
          - initiated
          - committed
          - aborted
          - expired
          title: State
          type: string
        upload_id:
          title: Upload Id
          type: string
      required:
      - content_type
      - created_at
      - expires_at
      - max_bytes
      - path
      - size_bytes
      - state
      - upload_id
      title: UploadStatusOut
