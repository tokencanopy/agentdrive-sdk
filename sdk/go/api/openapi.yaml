      properties:
        expires_at:
          format: date-time
          nullable: true
          title: Expires At
          type: string
        principal_id:
          description: "Required for `agent`, `user`, and `workspace`; omitted only\
            \ for `public`. For `agent` and `user` it is checked against that type's\
            \ id prefix (`tcagt_` / `tcusr_`) and a mismatch is `422 VALIDATION_ERROR`.\
            \ The prefix is all AgentDrive asserts: these ids are minted by Hub, so\
            \ their full shape is not AgentDrive's to enforce, and a well-formed id\
            \ naming a principal that does not exist — or belongs to another workspace\
            \ — is accepted here and simply never matches a token. The rule is conditional\
            \ on `principal_type`, so it is enforced at the boundary rather than expressible\
            \ as one JSON Schema `pattern`."
          nullable: true
          title: Principal Id
          type: string
        principal_type:
          enum:
          - agent
          - user
          - workspace
          - public
          title: Principal Type
          type: string
