name: Generate SDKs

# Regenerates the Python / TypeScript / Go clients from the LIVE AgentDrive
# OpenAPI document.
#
# The spec URL is the canonical product origin `drive.tokencanopy.com`. It is
# deliberately NOT `api.agentdrive.run`: that is a retired brand alias kept only
# through its retirement window, and pointing the generator at it is how these
# SDKs silently drifted an entire contract behind production.
#
# Output goes to a branch + PR rather than straight to `main`. A weekly drift
# diff is small and safe to auto-push; a contract change is not, and the v0
# reset is exactly the shape that must be reviewed before it lands.

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          SDK version baked into the generated package metadata. Bump to
          publish: 0.0.1 is already taken on npm (both scopes) and PyPI, and
          publish.yml skips versions that already exist.
        required: false
        default: "0.0.1"
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-sdks
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest OpenAPI spec
        run: |
          set -euo pipefail
          curl -sSf https://drive.tokencanopy.com/openapi.json -o sdk/openapi.json
          # Fail loudly if the fetched document is not the contract we expect,
          # rather than regenerating clients against something else.
          jq -e '(.servers | map(.url) | index("https://drive.tokencanopy.com")) != null' \
            sdk/openapi.json > /dev/null \
            || { echo "::error::fetched spec does not advertise drive.tokencanopy.com"; exit 1; }
          jq -e '[.paths | keys[] | select(startswith("/v0/drives"))] | length > 0' \
            sdk/openapi.json > /dev/null \
            || { echo "::error::fetched spec has no /v0/drives operations"; exit 1; }
          echo "spec OK: $(jq '.paths | length' sdk/openapi.json) paths"

      - name: Generate SDKs
        env:
          SDK_VERSION: ${{ github.event.inputs.version || '0.0.1' }}
        run: bash scripts/generate-sdks.sh sdk/openapi.json

      - name: Open a PR with the regenerated SDKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "agentdrive-bot"
          git config user.email "support@agentdrive.run"

          git add -A
          if git diff --cached --quiet; then
            echo "No SDK changes."
            exit 0
          fi

          BRANCH="sdk/regenerate"
          git checkout -B "$BRANCH"
          git commit -m "chore(sdk): regenerate from the live drive.tokencanopy.com contract"
          git push --force origin "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "PR already open for $BRANCH — the force-push updated it."
          else
            gh pr create --head "$BRANCH" \
              --title "chore(sdk): regenerate from the live contract" \
              --body "Regenerated by the \`Generate SDKs\` workflow from https://drive.tokencanopy.com/openapi.json. Review the operation diff before merging."
          fi
